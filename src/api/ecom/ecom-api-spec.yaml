openapi: 3.0.3
info:
  title: Node Kitchen Sink E-Commerce API
  description: E-commerce API for node-kitchen-sink project
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/ecom
    description: Local development server
paths:
  /product/create:
    post:
      summary: Create a new product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductData"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          description: Invalid data
        "500":
          description: Internal server error
  /product/update:
    post:
      summary: Update an existing product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductData"
      responses:
        "201":
          description: Product updated successfully
        "409":
          description: Invalid data
        "500":
          description: Internal server error
  /product/{id}:
    get:
      summary: Get product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid Product ID
        "404":
          description: Product not found
        "500":
          description: Internal server error
    delete:
      summary: Delete product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        "200":
          description: Product deleted successfully
        "400":
          description: Invalid Product ID
        "500":
          description: Internal server error
  /products:
    get:
      summary: Get all products
      tags:
        - Products
      responses:
        "200":
          description: Products found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          description: No products found
        "500":
          description: Internal server error
  /order/create:
    post:
      summary: Create a new order
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderData"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDTO"
        "400":
          description: Failed creating order
        "500":
          description: Internal server error
  /order/{id}:
    get:
      summary: Get order by ID
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid order ID
        "404":
          description: Order not found
        "500":
          description: Internal server error
    patch:
      summary: Update order
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderData"
      responses:
        "200":
          description: Order updated successfully
        "400":
          description: Invalid order ID
        "500":
          description: Internal server error
    delete:
      summary: Delete order
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      responses:
        "204":
          description: Order deleted successfully
        "400":
          description: Invalid order ID
        "500":
          description: Internal server error
  /order/{id}/status:
    patch:
      summary: Update order status
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - statusId
              properties:
                statusId:
                  type: integer
                  description: Status ID to set
      responses:
        "200":
          description: Order status updated
        "400":
          description: Invalid order ID or status ID
        "500":
          description: Internal server error
  /order/{id}/employee:
    patch:
      summary: Assign employee to order
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeId
              properties:
                employeeId:
                  type: integer
                  description: Employee ID to assign
      responses:
        "200":
          description: Employee assigned
        "400":
          description: Invalid order ID
        "500":
          description: Internal server error
  /order/{id}/employee/remove:
    patch:
      summary: Unassign employee from order
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      responses:
        "200":
          description: Employee unassigned
        "400":
          description: Invalid order ID
        "500":
          description: Internal server error
  /admin/signup:
    post:
      summary: Register new admin
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminData"
      responses:
        "201":
          description: Admin registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
        "400":
          description: Invalid data or user already exists
        "500":
          description: Internal server error
  /admin/login:
    post:
      summary: Login admin
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sid=sessionId; Path=/; HttpOnly; Max-Age=604800
        "400":
          description: Invalid credentials
        "500":
          description: Internal server error
  /admin/employee/add:
    post:
      summary: Add employee to pending list
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Employee activated
        "400":
          description: Empty data
        "500":
          description: Internal server error
  /admin/employees/{id}/payment-type:
    post:
      summary: Assign payment type to employee
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Employee ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentTypeId
              properties:
                paymentTypeId:
                  type: integer
                  description: "1 = Salary, 2 = Per Order"
                salaryAmount:
                  type: number
                  description: Salary amount (for paymentTypeId 1)
                perOrderRate:
                  type: number
                  description: Per order rate (for paymentTypeId 2)
      responses:
        "201":
          description: Payment type assigned
        "400":
          description: Missing required fields
        "500":
          description: Internal server error
  /admin/employees/{id}/payments:
    post:
      summary: Create manual payment for employee
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Employee ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                paymentPeriodLabel:
                  type: string
                  description: Human-readable label for the payment period
                notes:
                  type: string
                contractId:
                  type: integer
      responses:
        "201":
          description: Payment created
        "400":
          description: Missing required fields
        "500":
          description: Internal server error
  /admin/payroll/preview:
    post:
      summary: Preview payroll run
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollRunInput"
      responses:
        "201":
          description: Payroll preview created
        "400":
          description: Missing startDate or endDate
        "500":
          description: Internal server error
  /admin/payroll:
    post:
      summary: Create payroll run (DRAFT)
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollRunInput"
      responses:
        "201":
          description: Payroll run created
        "400":
          description: Missing startDate or endDate
        "500":
          description: Internal server error
    get:
      summary: List payroll runs
      tags:
        - Admin
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Filter by status (DRAFT, CONFIRMED, PAID)
      responses:
        "200":
          description: Payroll runs found
        "500":
          description: Internal server error
  /admin/payroll/{id}:
    get:
      summary: Get payroll run by ID
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Payroll run ID
      responses:
        "200":
          description: Payroll run found
        "404":
          description: Payroll run not found
        "500":
          description: Internal server error
  /admin/payroll/{id}/confirm:
    post:
      summary: Confirm payroll run
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Payroll run ID
      responses:
        "200":
          description: Payroll run confirmed
        "500":
          description: Internal server error
  /admin/payroll/{id}/paid:
    post:
      summary: Mark payroll run as paid
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Payroll run ID
      responses:
        "200":
          description: Payroll run marked as paid
        "500":
          description: Internal server error
  /admin/payroll/{runId}/items/{itemId}:
    get:
      summary: Get payroll run item by ID
      tags:
        - Admin
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
          description: Payroll run ID
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
          description: Payroll run item ID
      responses:
        "200":
          description: Payroll run item found
        "404":
          description: Payroll run item not found
        "500":
          description: Internal server error
  /admin/payroll/{runId}/items/{itemId}/confirm:
    post:
      summary: Confirm single payroll run item
      tags:
        - Admin
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
          description: Payroll run ID
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
          description: Payroll run item ID
      responses:
        "200":
          description: Payroll run item confirmed
        "400":
          description: Only INCLUDED and UNPAID items can be confirmed
        "500":
          description: Internal server error
  /admin/payroll/{runId}/items/{itemId}/paid:
    post:
      summary: Mark single payroll run item as paid
      tags:
        - Admin
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
          description: Payroll run ID
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
          description: Payroll run item ID
      responses:
        "200":
          description: Payroll run item marked as paid
        "400":
          description: Only CONFIRMED items can be marked as paid
        "500":
          description: Internal server error
  /employee/signup:
    post:
      summary: Register new employee
      tags:
        - Employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeData"
      responses:
        "201":
          description: Employee registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
        "400":
          description: Invalid data or user already exists
        "500":
          description: Internal server error
  /employee/login:
    post:
      summary: Login employee
      tags:
        - Employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sid=sessionId; Path=/; HttpOnly; Max-Age=604800
        "400":
          description: Invalid credentials
        "500":
          description: Internal server error
components:
  schemas:
    ProductData:
      type: object
      required:
        - name
        - price
        - categoryId
      properties:
        id:
          type: integer
          description: Product ID (optional for create)
        name:
          type: string
          description: Product name
        description:
          type: string
          description: Product description
        price:
          type: number
          description: Product price
        categoryId:
          type: integer
          description: Category ID
        initialStock:
          type: integer
          description: Initial stock quantity
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        categoryId:
          type: integer
        initialStock:
          type: integer
    Customer:
      type: object
      required:
        - name
        - phone
        - address
        - email
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
    OrderItem:
      type: object
      required:
        - productId
        - price
        - quantity
      properties:
        productId:
          type: integer
        price:
          type: number
        quantity:
          type: integer
    OrderData:
      type: object
      required:
        - customer
        - orderItems
        - orderDate
        - orderStatusId
      properties:
        orderId:
          type: integer
        customer:
          $ref: "#/components/schemas/Customer"
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        orderDate:
          type: string
          format: date-time
        orderStatusId:
          type: integer
        employeeId:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
    OrderDTO:
      type: object
      properties:
        orderId:
          type: integer
        customerId:
          type: integer
        orderDate:
          type: string
          format: date-time
        orderStatusId:
          type: integer
        notes:
          type: string
          nullable: true
    OrderResponse:
      type: object
      properties:
        orderId:
          type: integer
        customerId:
          type: integer
        customer:
          $ref: "#/components/schemas/Customer"
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        orderDate:
          type: string
          format: date-time
        orderStatusId:
          type: integer
        employeeId:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
    AdminData:
      type: object
      required:
        - name
        - email
        - password
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    EmployeeData:
      type: object
      required:
        - name
        - email
        - phoneNumber
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        password:
          type: string
          format: password
    PayrollRunInput:
      type: object
      required:
        - startDate
        - endDate
      properties:
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        employeeIds:
          type: array
          items:
            type: integer
    PayrollRunStatus:
      type: string
      enum:
        - DRAFT
        - CONFIRMED
        - PAID
    PayrollRunItemCalculationStatus:
      type: string
      enum:
        - PENDING
        - INCLUDED
        - EXCLUDED
    PayrollRunItemPaymentStatus:
      type: string
      enum:
        - UNPAID
        - CONFIRMED
        - PAID
    PaymentType:
      type: string
      enum:
        - SALARY
        - PER_ORDER
